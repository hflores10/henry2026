<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Portafolio tecnologico academico</title>
  <desc id="desc">Ilustracion abstracta de una pantalla con codigo, documentos y conexiones para un portafolio academico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10284a"/>
      <stop offset="0.52" stop-color="#11172b"/>
      <stop offset="1" stop-color="#093429"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3de0a2"/>
      <stop offset="1" stop-color="#39a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <path d="M0 90 C160 160 270 20 430 88 C590 156 660 88 960 136 V0 H0 Z" fill="#39a8ff" opacity="0.12"/>
  <path d="M0 510 C180 440 260 580 430 510 C610 435 755 520 960 460 V600 H0 Z" fill="#3de0a2" opacity="0.14"/>

  <g opacity="0.38" stroke="#9b7cff" stroke-width="2" fill="none">
    <path d="M110 130 H260 V220 H420"/>
    <path d="M690 120 H820 V250"/>
    <path d="M130 455 H305 V380"/>
    <path d="M650 470 H815 V350"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="120" width="500" height="330" rx="18" fill="#0b1728" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="250" y="145" width="460" height="38" rx="10" fill="#12243b"/>
    <circle cx="278" cy="164" r="6" fill="#ff6b6b"/>
    <circle cx="300" cy="164" r="6" fill="#ffd166"/>
    <circle cx="322" cy="164" r="6" fill="#3de0a2"/>

    <rect x="270" y="215" width="155" height="150" rx="12" fill="#132c49" stroke="#39a8ff" stroke-opacity="0.28"/>
    <rect x="450" y="215" width="240" height="34" rx="8" fill="#18304d"/>
    <rect x="450" y="270" width="190" height="16" rx="8" fill="#3de0a2" opacity="0.8"/>
    <rect x="450" y="302" width="220" height="16" rx="8" fill="#39a8ff" opacity="0.7"/>
    <rect x="450" y="334" width="150" height="16" rx="8" fill="#9b7cff" opacity="0.75"/>
    <rect x="450" y="382" width="118" height="34" rx="8" fill="url(#accent)"/>
    <rect x="585" y="382" width="104" height="34" rx="8" fill="#1f3a5d" stroke="#ffffff" stroke-opacity="0.12"/>

    <path d="M310 310 L342 274 L382 332" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="338" cy="274" r="15" fill="#39a8ff"/>
    <circle cx="384" cy="332" r="15" fill="#3de0a2"/>
    <circle cx="310" cy="310" r="15" fill="#9b7cff"/>
  </g>

  <g fill="#edf6ff" opacity="0.84">
    <text x="292" y="505" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">HTML</text>
    <text x="428" y="505" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Java</text>
    <text x="548" y="505" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">SQL</text>
  </g>
</svg>
